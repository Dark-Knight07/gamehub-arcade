<!doctype html>
<html lang="en" data-game="star-sentinel">
<head>
<!-- Offline edition from Owais GameHub. Open this file in any modern browser. -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Star Sentinel | Owais GameHub</title>
<style>
/* Shared look for every Owais GameHub game */
:root {
  --bg: #06070d; --panel: #11142a; --edge: rgba(148, 163, 255, 0.18);
  --ink: #e8ebff; --dim: #8f96bf; --cyan: #40e0ff; --violet: #8b6bff; --rose: #ff4fa3; --lime: #9dff6a; --amber: #ffc857;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at 50% 0%, #151a3a 0%, var(--bg) 70%); color: var(--ink);
  font-family: "Sora Variable", "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
.stage { position: fixed; inset: 0; display: grid; place-items: center; }
canvas { display: block; border-radius: 10px; box-shadow: 0 0 0 1px var(--edge), 0 30px 80px -30px rgba(64, 224, 255, 0.35); }
button { font: inherit; color: inherit; cursor: pointer; }
.btn { border: 1px solid var(--edge); background: rgba(255, 255, 255, 0.05); padding: 10px 18px; border-radius: 10px; font-weight: 600; }
.btn:hover { border-color: var(--cyan); }
.btn.primary { background: linear-gradient(135deg, var(--cyan), var(--violet)); border: 0; color: #050612; }
.btn.on { border-color: var(--cyan); background: rgba(64, 224, 255, 0.12); }
.hud { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.stat { background: rgba(255, 255, 255, 0.04); border: 1px solid var(--edge); border-radius: 10px; padding: 8px 14px; text-align: center; min-width: 84px; }
.stat small { display: block; color: var(--dim); font-size: 11px; letter-spacing: .04em; }
.stat b { font-size: 20px; font-variant-numeric: tabular-nums; }
.msg { min-height: 24px; text-align: center; color: var(--dim); font-size: 14px; }
.panel { width: min(96vw, 560px); display: grid; gap: 16px; padding: 16px; }
.title { margin: 0; text-align: center; font-size: 22px; letter-spacing: .02em; }
.ogh-pause { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
  background: rgba(6, 7, 13, 0.82); backdrop-filter: blur(6px); z-index: 99; cursor: pointer; }
.ogh-pause strong { font-size: 32px; }
.ogh-pause p { color: var(--dim); margin: 8px 0 0; }
.ogh-pause .ogh-keys { font-size: 13px; }
@media (max-height: 520px) { .panel { gap: 10px; padding: 8px; } .stat b { font-size: 16px; } }

</style>
<script>
/*
 * Owais GameHub Game SDK
 * Shared by every built-in game. Talks to the GameHub player through postMessage:
 *   host -> game : { source: "ogh-host", type: "pause" | "resume" | "restart" | "mute", muted }
 *   game -> host : { source: "ogh-game", game, type: "ready" | "score" | "gameover" | "win" | "paused" | "resumed" | "muted", ... }
 * When a game runs on its own (offline download), the SDK shows its own pause screen and
 * handles P / Esc (pause), R (restart) and M (mute).
 */
(function () {
  "use strict";
  var GAME_ID = document.documentElement.getAttribute("data-game") || "game";
  var embedded = window.parent !== window;
  var handlers = {};
  var audioCtx = null;
  var lowerIsBetter = false;
  var overlay = null;

  function read(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (e) {
      return fallback;
    }
  }
  function write(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {
      /* storage unavailable: the game still works, it just won't remember */
    }
  }
  function emit(ev, arg) {
    (handlers[ev] || []).forEach(function (fn) {
      try { fn(arg); } catch (e) { console.error(e); }
    });
  }

  var GH = {
    id: GAME_ID,
    embedded: embedded,
    paused: false,
    muted: read("ogh:muted", false) === true,

    config: function (opts) {
      lowerIsBetter = !!(opts && opts.lowerIsBetter);
    },
    on: function (ev, fn) {
      (handlers[ev] = handlers[ev] || []).push(fn);
    },
    send: function (type, data) {
      if (!embedded) return;
      var msg = { source: "ogh-game", game: GAME_ID, type: type };
      if (data) for (var k in data) msg[k] = data[k];
      try { window.parent.postMessage(msg, window.location.origin === "null" ? "*" : window.location.origin); } catch (e) { /* ignore */ }
    },
    ready: function () {
      GH.send("ready", { muted: GH.muted });
    },
    score: function (value) {
      GH.send("score", { value: value });
    },
    best: function () {
      return read("ogh:best:" + GAME_ID, null);
    },
    submit: function (value) {
      var best = GH.best();
      var better = best === null || (lowerIsBetter ? value < best : value > best);
      if (better) write("ogh:best:" + GAME_ID, value);
      return { best: better ? value : best, isNew: better };
    },
    gameOver: function (finalScore) {
      var r = GH.submit(finalScore);
      GH.send("gameover", { score: finalScore, best: r.best, isNew: r.isNew });
      return r;
    },
    win: function (finalScore) {
      var r = GH.submit(finalScore);
      GH.send("win", { score: finalScore, best: r.best, isNew: r.isNew });
      return r;
    },
    save: function (state) { write("ogh:save:" + GAME_ID, state); },
    load: function () { return read("ogh:save:" + GAME_ID, null); },
    clearSave: function () {
      try { localStorage.removeItem("ogh:save:" + GAME_ID); } catch (e) { /* ignore */ }
    },

    pause: function () {
      if (GH.paused) return;
      GH.paused = true;
      emit("pause");
      GH.send("paused");
      showOverlay(true);
    },
    resume: function () {
      if (!GH.paused) return;
      GH.paused = false;
      emit("resume");
      GH.send("resumed");
      showOverlay(false);
    },
    togglePause: function () {
      GH.paused ? GH.resume() : GH.pause();
    },
    restart: function () {
      GH.paused = false;
      showOverlay(false);
      emit("restart");
      GH.send("resumed");
    },
    setMuted: function (m) {
      GH.muted = !!m;
      write("ogh:muted", GH.muted);
      emit("mute", GH.muted);
      GH.send("muted", { muted: GH.muted });
    },

    /* Short synthesized sound effect: GH.sound(440, 0.08, "square", 0.05, 220) */
    sound: function (freq, duration, type, volume, slideTo) {
      if (GH.muted) return;
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        var t = audioCtx.currentTime;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = type || "sine";
        osc.frequency.setValueAtTime(freq, t);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + (duration || 0.1));
        gain.gain.setValueAtTime(volume || 0.05, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + (duration || 0.1));
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + (duration || 0.1) + 0.02);
      } catch (e) { /* audio blocked */ }
    },

    /* Canvas at a fixed logical size, scaled to fit the viewport and sharp on HiDPI screens */
    fit: function (canvas, W, H) {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      canvas._W = W;
      canvas._H = H;
      var c = canvas.getContext("2d");
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      function size() {
        var s = Math.min(window.innerWidth / W, window.innerHeight / H);
        canvas.style.width = Math.floor(W * s) + "px";
        canvas.style.height = Math.floor(H * s) + "px";
      }
      size();
      window.addEventListener("resize", size);
      return c;
    },
    /* Pointer/touch position in logical canvas coordinates */
    point: function (canvas, e) {
      var r = canvas.getBoundingClientRect();
      var src = e.touches && e.touches[0] ? e.touches[0] : e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : e;
      return {
        x: ((src.clientX - r.left) / r.width) * canvas._W,
        y: ((src.clientY - r.top) / r.height) * canvas._H,
      };
    },
    /* Fixed-timestep-friendly loop; update is skipped while paused */
    loop: function (update, render) {
      var last = performance.now();
      function frame(now) {
        var dt = Math.min((now - last) / 1000, 1 / 20);
        last = now;
        if (!GH.paused) update(dt);
        render();
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    },
    /* Swipe detection: cb("up" | "down" | "left" | "right") */
    swipe: function (el, cb, min) {
      var sx = 0, sy = 0, active = false;
      min = min || 24;
      el.addEventListener("touchstart", function (e) {
        active = true;
        sx = e.touches[0].clientX;
        sy = e.touches[0].clientY;
      }, { passive: true });
      el.addEventListener("touchmove", function (e) {
        if (active) e.preventDefault();
      }, { passive: false });
      el.addEventListener("touchend", function (e) {
        if (!active) return;
        active = false;
        var dx = e.changedTouches[0].clientX - sx;
        var dy = e.changedTouches[0].clientY - sy;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < min) return;
        cb(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : dy > 0 ? "down" : "up");
      });
    },
  };

  function showOverlay(on) {
    if (embedded) return; // the GameHub player draws its own pause screen
    if (!overlay) {
      overlay = document.createElement("div");
      overlay.className = "ogh-pause";
      overlay.innerHTML =
        '<div><strong>Paused</strong><p>Press P or tap to resume</p><p class="ogh-keys">R restart &nbsp; M sound on/off</p></div>';
      overlay.addEventListener("click", GH.resume);
      document.body.appendChild(overlay);
    }
    overlay.style.display = on ? "flex" : "none";
  }

  window.addEventListener("message", function (e) {
    if (e.origin !== window.location.origin && window.location.origin !== "null") return;
    var d = e.data;
    if (!d || d.source !== "ogh-host") return;
    if (d.type === "pause") GH.pause();
    else if (d.type === "resume") GH.resume();
    else if (d.type === "restart") GH.restart();
    else if (d.type === "mute") GH.setMuted(d.muted);
  });

  window.addEventListener("keydown", function (e) {
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    var k = e.key.toLowerCase();
    if (k === "p" || k === "escape") GH.togglePause();
    else if (k === "r" && !e.ctrlKey && !e.metaKey) GH.restart();
    else if (k === "m") GH.setMuted(!GH.muted);
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) GH.pause();
  });

  /* Canvas text and overlay helpers used by the arcade games */
  GH.text = function (c, s, x, y, size, color, align, weight) {
    c.font = (weight || 600) + " " + size + "px 'Sora Variable', 'Segoe UI', system-ui, sans-serif";
    c.fillStyle = color || "#e8ebff";
    c.textAlign = align || "center";
    c.textBaseline = "middle";
    c.fillText(s, x, y);
  };
  GH.card = function (c, W, H, title, sub, extra) {
    c.fillStyle = "rgba(6, 7, 13, 0.74)";
    c.fillRect(0, 0, W, H);
    GH.text(c, title, W / 2, H / 2 - 26, Math.min(40, W / 10), "#e8ebff", "center", 700);
    if (sub) GH.text(c, sub, W / 2, H / 2 + 16, 15, "#8f96bf", "center", 500);
    if (extra) GH.text(c, extra, W / 2, H / 2 + 46, 14, "#40e0ff", "center", 600);
  };
  GH.rand = function (a, b) { return a + Math.random() * (b - a); };
  GH.hit = function (a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  };

  window.GameHub = GH;
  window.addEventListener("load", GH.ready);
})();

</script>
</head>
<body>
<div class="stage"><canvas id="c" aria-label="Star Sentinel space shooter"></canvas></div>
<script>
(function () {
  var GH = GameHub, cv = document.getElementById("c"), W = 480, H = 720, c = GH.fit(cv, W, H);
  var ship, shots, foes, foeShots, booms, stars, score, lives, state, time, spawnT, fireT, keys = {}, target = null, best, wave;
  stars = [];
  for (var i = 0; i < 90; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, z: Math.random() * 3 + 0.5 });

  function reset() {
    ship = { x: W / 2, y: H - 90, r: 16, inv: 0 };
    shots = []; foes = []; foeShots = []; booms = [];
    score = 0; lives = 3; time = 0; spawnT = 1; fireT = 0; wave = 1; target = null;
    state = "ready"; best = GH.best() || 0; GH.score(0);
  }
  function start() {
    if (GH.paused) return;
    if (state === "over") reset();
    if (state === "ready") state = "play";
  }
  function spawnFoe() {
    var kind = Math.random();
    var lvl = Math.min(1 + time / 25, 4);
    if (kind < 0.55) foes.push({ type: "drone", x: GH.rand(30, W - 30), y: -30, r: 16, vy: GH.rand(90, 140) * (0.8 + lvl * 0.2), hp: 1, t: 0, pts: 50 });
    else if (kind < 0.85) foes.push({ type: "weaver", x: GH.rand(60, W - 60), y: -30, r: 17, vy: 100 + lvl * 15, hp: 2, t: 0, ox: 0, pts: 100 });
    else foes.push({ type: "gunner", x: GH.rand(50, W - 50), y: -30, r: 22, vy: 60, hp: 4, t: 0, fire: 1.2, pts: 200 });
  }
  function explode(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * 6.28, s = GH.rand(40, 240);
      booms.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: GH.rand(0.3, 0.7), color: color });
    }
  }
  function hurt() {
    if (ship.inv > 0) return;
    lives--; ship.inv = 2;
    explode(ship.x, ship.y, "#40e0ff", 30);
    GH.sound(160, 0.4, "sawtooth", 0.06, 50);
    if (lives <= 0) { state = "over"; best = GH.gameOver(score).best; }
  }
  function update(dt) {
    stars.forEach(function (s) { s.y += s.z * (state === "play" ? 60 : 20) * dt; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } });
    booms.forEach(function (p) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt; });
    booms = booms.filter(function (p) { return p.life > 0; });
    if (state !== "play") return;
    time += dt; wave = 1 + Math.floor(time / 25);
    var sp = 360;
    if (keys.left) ship.x -= sp * dt;
    if (keys.right) ship.x += sp * dt;
    if (keys.up) ship.y -= sp * dt;
    if (keys.down) ship.y += sp * dt;
    if (target) { ship.x += (target.x - ship.x) * Math.min(1, dt * 14); ship.y += (target.y - ship.y) * Math.min(1, dt * 14); }
    ship.x = Math.max(20, Math.min(W - 20, ship.x)); ship.y = Math.max(H * 0.35, Math.min(H - 30, ship.y));
    ship.inv = Math.max(0, ship.inv - dt);
    fireT -= dt;
    if (fireT <= 0) {
      fireT = 0.17;
      shots.push({ x: ship.x - 8, y: ship.y - 14 }, { x: ship.x + 8, y: ship.y - 14 });
      GH.sound(900, 0.03, "square", 0.015, 600);
    }
    shots.forEach(function (s) { s.y -= 720 * dt; });
    shots = shots.filter(function (s) { return s.y > -20; });
    spawnT -= dt;
    if (spawnT <= 0) { spawnFoe(); spawnT = Math.max(0.35, 1.1 - time / 60); }
    foes.forEach(function (f) {
      f.t += dt; f.y += f.vy * dt;
      if (f.type === "weaver") f.x += Math.cos(f.t * 3) * 120 * dt;
      if (f.type === "gunner") {
        if (f.y > 120) f.vy = 20;
        f.fire -= dt;
        if (f.fire <= 0) {
          f.fire = 1.4;
          var a = Math.atan2(ship.y - f.y, ship.x - f.x);
          foeShots.push({ x: f.x, y: f.y, vx: Math.cos(a) * 230, vy: Math.sin(a) * 230 });
        }
      }
    });
    foeShots.forEach(function (s) { s.x += s.vx * dt; s.y += s.vy * dt; });
    foeShots = foeShots.filter(function (s) { return s.y < H + 20 && s.y > -20 && s.x > -20 && s.x < W + 20; });
    for (var i = foes.length - 1; i >= 0; i--) {
      var f = foes[i];
      for (var j = shots.length - 1; j >= 0; j--) {
        var s = shots[j];
        if (Math.abs(s.x - f.x) < f.r && Math.abs(s.y - f.y) < f.r) {
          shots.splice(j, 1); f.hp--;
          if (f.hp <= 0) {
            explode(f.x, f.y, f.type === "gunner" ? "#ffc857" : f.type === "weaver" ? "#9dff6a" : "#ff4fa3", 18);
            score += f.pts; GH.score(score); foes.splice(i, 1);
            GH.sound(140, 0.18, "square", 0.04, 60);
            break;
          }
        }
      }
    }
    foes = foes.filter(function (f) {
      if (Math.hypot(f.x - ship.x, f.y - ship.y) < f.r + ship.r - 4) { hurt(); explode(f.x, f.y, "#ff4fa3", 14); return false; }
      return f.y < H + 40;
    });
    foeShots = foeShots.filter(function (s) {
      if (Math.hypot(s.x - ship.x, s.y - ship.y) < ship.r - 4) { hurt(); return false; }
      return true;
    });
  }
  function drawShip(x, y) {
    c.save(); c.translate(x, y);
    c.shadowBlur = 20; c.shadowColor = "#40e0ff";
    c.fillStyle = "#40e0ff";
    c.beginPath(); c.moveTo(0, -20); c.lineTo(16, 14); c.lineTo(5, 8); c.lineTo(0, 16); c.lineTo(-5, 8); c.lineTo(-16, 14); c.closePath(); c.fill();
    c.fillStyle = "#ffc857"; c.shadowColor = "#ffc857";
    c.beginPath(); c.moveTo(-4, 16); c.lineTo(0, 24 + Math.random() * 8); c.lineTo(4, 16); c.fill();
    c.restore();
  }
  function render() {
    c.fillStyle = "#05060f"; c.fillRect(0, 0, W, H);
    stars.forEach(function (s) { c.fillStyle = "rgba(200,210,255," + s.z / 4 + ")"; c.fillRect(s.x, s.y, s.z * 0.8, s.z * 2); });
    c.shadowBlur = 10; c.shadowColor = "#40e0ff"; c.fillStyle = "#b8f4ff";
    shots.forEach(function (s) { c.fillRect(s.x - 1.5, s.y - 8, 3, 14); });
    c.shadowColor = "#ff4fa3"; c.fillStyle = "#ff8cc4";
    foeShots.forEach(function (s) { c.beginPath(); c.arc(s.x, s.y, 5, 0, 6.3); c.fill(); });
    foes.forEach(function (f) {
      c.save(); c.translate(f.x, f.y);
      if (f.type === "drone") {
        c.shadowColor = "#ff4fa3"; c.fillStyle = "#ff4fa3";
        c.beginPath(); c.moveTo(0, 16); c.lineTo(15, -10); c.lineTo(0, -4); c.lineTo(-15, -10); c.closePath(); c.fill();
      } else if (f.type === "weaver") {
        c.shadowColor = "#9dff6a"; c.fillStyle = "#9dff6a"; c.rotate(f.t * 3);
        c.fillRect(-12, -12, 24, 24);
        c.fillStyle = "#05060f"; c.fillRect(-5, -5, 10, 10);
      } else {
        c.shadowColor = "#ffc857"; c.fillStyle = "#ffc857";
        c.beginPath();
        for (var k = 0; k < 6; k++) { var a = k / 6 * 6.28; c.lineTo(Math.cos(a) * 22, Math.sin(a) * 22); }
        c.closePath(); c.fill();
        c.fillStyle = "#05060f"; c.beginPath(); c.arc(0, 0, 8, 0, 6.3); c.fill();
      }
      c.restore();
    });
    c.shadowBlur = 0;
    booms.forEach(function (p) { c.globalAlpha = Math.min(1, p.life * 2); c.fillStyle = p.color; c.fillRect(p.x - 2, p.y - 2, 4, 4); });
    c.globalAlpha = 1;
    if (state !== "over" && (ship.inv <= 0 || Math.floor(ship.inv * 10) % 2 === 0)) drawShip(ship.x, ship.y);
    GH.text(c, "Score " + score, 16, 28, 18, "#e8ebff", "left", 700);
    GH.text(c, "Wave " + wave, W / 2, 28, 15, "#8f96bf");
    for (var l = 0; l < lives; l++) { c.fillStyle = "#40e0ff"; c.beginPath(); c.moveTo(W - 22 - l * 22, 20); c.lineTo(W - 14 - l * 22, 36); c.lineTo(W - 30 - l * 22, 36); c.fill(); }
    if (state === "ready") GH.card(c, W, H, "Star Sentinel", "Drag, or use arrow keys to fly. You fire automatically.", "Tap or press Space to launch");
    if (state === "over") GH.card(c, W, H, "Ship destroyed", "Score " + score + "   Best " + best, "Tap or press Space to fly again");
  }
  var km = { ArrowLeft: "left", a: "left", ArrowRight: "right", d: "right", ArrowUp: "up", w: "up", ArrowDown: "down", s: "down" };
  window.addEventListener("keydown", function (e) {
    if (km[e.key]) { e.preventDefault(); keys[km[e.key]] = true; target = null; start(); }
    if (e.key === " ") { e.preventDefault(); start(); }
  });
  window.addEventListener("keyup", function (e) { if (km[e.key]) keys[km[e.key]] = false; });
  function aim(e) { if (state !== "play" || GH.paused) return; var p = GH.point(cv, e); target = { x: p.x, y: p.y - (e.touches ? 60 : 0) }; }
  cv.addEventListener("mousedown", function (e) { start(); aim(e); });
  cv.addEventListener("mousemove", function (e) { if (e.buttons) aim(e); });
  cv.addEventListener("mouseup", function () { target = null; });
  cv.addEventListener("touchstart", function (e) { e.preventDefault(); start(); aim(e); }, { passive: false });
  cv.addEventListener("touchmove", function (e) { e.preventDefault(); aim(e); }, { passive: false });
  cv.addEventListener("touchend", function () { target = null; });
  GH.on("pause", function () { keys = {}; target = null; });
  GH.on("restart", reset);
  reset();
  GH.loop(update, render);
})();
</script>
