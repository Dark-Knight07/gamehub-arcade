<!doctype html>
<html lang="en" data-game="memory-match">
<head>
<!-- Offline edition from Owais GameHub. Open this file in any modern browser. -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Memory Match | Owais GameHub</title>
<style>
/* Shared look for every Owais GameHub game */
:root {
  --bg: #06070d; --panel: #11142a; --edge: rgba(148, 163, 255, 0.18);
  --ink: #e8ebff; --dim: #8f96bf; --cyan: #40e0ff; --violet: #8b6bff; --rose: #ff4fa3; --lime: #9dff6a; --amber: #ffc857;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at 50% 0%, #151a3a 0%, var(--bg) 70%); color: var(--ink);
  font-family: "Sora Variable", "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
.stage { position: fixed; inset: 0; display: grid; place-items: center; }
canvas { display: block; border-radius: 10px; box-shadow: 0 0 0 1px var(--edge), 0 30px 80px -30px rgba(64, 224, 255, 0.35); }
button { font: inherit; color: inherit; cursor: pointer; }
.btn { border: 1px solid var(--edge); background: rgba(255, 255, 255, 0.05); padding: 10px 18px; border-radius: 10px; font-weight: 600; }
.btn:hover { border-color: var(--cyan); }
.btn.primary { background: linear-gradient(135deg, var(--cyan), var(--violet)); border: 0; color: #050612; }
.btn.on { border-color: var(--cyan); background: rgba(64, 224, 255, 0.12); }
.hud { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.stat { background: rgba(255, 255, 255, 0.04); border: 1px solid var(--edge); border-radius: 10px; padding: 8px 14px; text-align: center; min-width: 84px; }
.stat small { display: block; color: var(--dim); font-size: 11px; letter-spacing: .04em; }
.stat b { font-size: 20px; font-variant-numeric: tabular-nums; }
.msg { min-height: 24px; text-align: center; color: var(--dim); font-size: 14px; }
.panel { width: min(96vw, 560px); display: grid; gap: 16px; padding: 16px; }
.title { margin: 0; text-align: center; font-size: 22px; letter-spacing: .02em; }
.ogh-pause { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
  background: rgba(6, 7, 13, 0.82); backdrop-filter: blur(6px); z-index: 99; cursor: pointer; }
.ogh-pause strong { font-size: 32px; }
.ogh-pause p { color: var(--dim); margin: 8px 0 0; }
.ogh-pause .ogh-keys { font-size: 13px; }
@media (max-height: 520px) { .panel { gap: 10px; padding: 8px; } .stat b { font-size: 16px; } }

</style>
<script>
/*
 * Owais GameHub Game SDK
 * Shared by every built-in game. Talks to the GameHub player through postMessage:
 *   host -> game : { source: "ogh-host", type: "pause" | "resume" | "restart" | "mute", muted }
 *   game -> host : { source: "ogh-game", game, type: "ready" | "score" | "gameover" | "win" | "paused" | "resumed" | "muted", ... }
 * When a game runs on its own (offline download), the SDK shows its own pause screen and
 * handles P / Esc (pause), R (restart) and M (mute).
 */
(function () {
  "use strict";
  var GAME_ID = document.documentElement.getAttribute("data-game") || "game";
  var embedded = window.parent !== window;
  var handlers = {};
  var audioCtx = null;
  var lowerIsBetter = false;
  var overlay = null;

  function read(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (e) {
      return fallback;
    }
  }
  function write(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {
      /* storage unavailable: the game still works, it just won't remember */
    }
  }
  function emit(ev, arg) {
    (handlers[ev] || []).forEach(function (fn) {
      try { fn(arg); } catch (e) { console.error(e); }
    });
  }

  var GH = {
    id: GAME_ID,
    embedded: embedded,
    paused: false,
    muted: read("ogh:muted", false) === true,

    config: function (opts) {
      lowerIsBetter = !!(opts && opts.lowerIsBetter);
    },
    on: function (ev, fn) {
      (handlers[ev] = handlers[ev] || []).push(fn);
    },
    send: function (type, data) {
      if (!embedded) return;
      var msg = { source: "ogh-game", game: GAME_ID, type: type };
      if (data) for (var k in data) msg[k] = data[k];
      try { window.parent.postMessage(msg, window.location.origin === "null" ? "*" : window.location.origin); } catch (e) { /* ignore */ }
    },
    ready: function () {
      GH.send("ready", { muted: GH.muted });
    },
    score: function (value) {
      GH.send("score", { value: value });
    },
    best: function () {
      return read("ogh:best:" + GAME_ID, null);
    },
    submit: function (value) {
      var best = GH.best();
      var better = best === null || (lowerIsBetter ? value < best : value > best);
      if (better) write("ogh:best:" + GAME_ID, value);
      return { best: better ? value : best, isNew: better };
    },
    gameOver: function (finalScore) {
      var r = GH.submit(finalScore);
      GH.send("gameover", { score: finalScore, best: r.best, isNew: r.isNew });
      return r;
    },
    win: function (finalScore) {
      var r = GH.submit(finalScore);
      GH.send("win", { score: finalScore, best: r.best, isNew: r.isNew });
      return r;
    },
    save: function (state) { write("ogh:save:" + GAME_ID, state); },
    load: function () { return read("ogh:save:" + GAME_ID, null); },
    clearSave: function () {
      try { localStorage.removeItem("ogh:save:" + GAME_ID); } catch (e) { /* ignore */ }
    },

    pause: function () {
      if (GH.paused) return;
      GH.paused = true;
      emit("pause");
      GH.send("paused");
      showOverlay(true);
    },
    resume: function () {
      if (!GH.paused) return;
      GH.paused = false;
      emit("resume");
      GH.send("resumed");
      showOverlay(false);
    },
    togglePause: function () {
      GH.paused ? GH.resume() : GH.pause();
    },
    restart: function () {
      GH.paused = false;
      showOverlay(false);
      emit("restart");
      GH.send("resumed");
    },
    setMuted: function (m) {
      GH.muted = !!m;
      write("ogh:muted", GH.muted);
      emit("mute", GH.muted);
      GH.send("muted", { muted: GH.muted });
    },

    /* Short synthesized sound effect: GH.sound(440, 0.08, "square", 0.05, 220) */
    sound: function (freq, duration, type, volume, slideTo) {
      if (GH.muted) return;
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        var t = audioCtx.currentTime;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = type || "sine";
        osc.frequency.setValueAtTime(freq, t);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + (duration || 0.1));
        gain.gain.setValueAtTime(volume || 0.05, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + (duration || 0.1));
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + (duration || 0.1) + 0.02);
      } catch (e) { /* audio blocked */ }
    },

    /* Canvas at a fixed logical size, scaled to fit the viewport and sharp on HiDPI screens */
    fit: function (canvas, W, H) {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      canvas._W = W;
      canvas._H = H;
      var c = canvas.getContext("2d");
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      function size() {
        var s = Math.min(window.innerWidth / W, window.innerHeight / H);
        canvas.style.width = Math.floor(W * s) + "px";
        canvas.style.height = Math.floor(H * s) + "px";
      }
      size();
      window.addEventListener("resize", size);
      return c;
    },
    /* Pointer/touch position in logical canvas coordinates */
    point: function (canvas, e) {
      var r = canvas.getBoundingClientRect();
      var src = e.touches && e.touches[0] ? e.touches[0] : e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : e;
      return {
        x: ((src.clientX - r.left) / r.width) * canvas._W,
        y: ((src.clientY - r.top) / r.height) * canvas._H,
      };
    },
    /* Fixed-timestep-friendly loop; update is skipped while paused */
    loop: function (update, render) {
      var last = performance.now();
      function frame(now) {
        var dt = Math.min((now - last) / 1000, 1 / 20);
        last = now;
        if (!GH.paused) update(dt);
        render();
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    },
    /* Swipe detection: cb("up" | "down" | "left" | "right") */
    swipe: function (el, cb, min) {
      var sx = 0, sy = 0, active = false;
      min = min || 24;
      el.addEventListener("touchstart", function (e) {
        active = true;
        sx = e.touches[0].clientX;
        sy = e.touches[0].clientY;
      }, { passive: true });
      el.addEventListener("touchmove", function (e) {
        if (active) e.preventDefault();
      }, { passive: false });
      el.addEventListener("touchend", function (e) {
        if (!active) return;
        active = false;
        var dx = e.changedTouches[0].clientX - sx;
        var dy = e.changedTouches[0].clientY - sy;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < min) return;
        cb(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : dy > 0 ? "down" : "up");
      });
    },
  };

  function showOverlay(on) {
    if (embedded) return; // the GameHub player draws its own pause screen
    if (!overlay) {
      overlay = document.createElement("div");
      overlay.className = "ogh-pause";
      overlay.innerHTML =
        '<div><strong>Paused</strong><p>Press P or tap to resume</p><p class="ogh-keys">R restart &nbsp; M sound on/off</p></div>';
      overlay.addEventListener("click", GH.resume);
      document.body.appendChild(overlay);
    }
    overlay.style.display = on ? "flex" : "none";
  }

  window.addEventListener("message", function (e) {
    if (e.origin !== window.location.origin && window.location.origin !== "null") return;
    var d = e.data;
    if (!d || d.source !== "ogh-host") return;
    if (d.type === "pause") GH.pause();
    else if (d.type === "resume") GH.resume();
    else if (d.type === "restart") GH.restart();
    else if (d.type === "mute") GH.setMuted(d.muted);
  });

  window.addEventListener("keydown", function (e) {
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    var k = e.key.toLowerCase();
    if (k === "p" || k === "escape") GH.togglePause();
    else if (k === "r" && !e.ctrlKey && !e.metaKey) GH.restart();
    else if (k === "m") GH.setMuted(!GH.muted);
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) GH.pause();
  });

  /* Canvas text and overlay helpers used by the arcade games */
  GH.text = function (c, s, x, y, size, color, align, weight) {
    c.font = (weight || 600) + " " + size + "px 'Sora Variable', 'Segoe UI', system-ui, sans-serif";
    c.fillStyle = color || "#e8ebff";
    c.textAlign = align || "center";
    c.textBaseline = "middle";
    c.fillText(s, x, y);
  };
  GH.card = function (c, W, H, title, sub, extra) {
    c.fillStyle = "rgba(6, 7, 13, 0.74)";
    c.fillRect(0, 0, W, H);
    GH.text(c, title, W / 2, H / 2 - 26, Math.min(40, W / 10), "#e8ebff", "center", 700);
    if (sub) GH.text(c, sub, W / 2, H / 2 + 16, 15, "#8f96bf", "center", 500);
    if (extra) GH.text(c, extra, W / 2, H / 2 + 46, 14, "#40e0ff", "center", 600);
  };
  GH.rand = function (a, b) { return a + Math.random() * (b - a); };
  GH.hit = function (a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  };

  window.GameHub = GH;
  window.addEventListener("load", GH.ready);
})();

</script>
</head>
<style>
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: min(90vw, 58vh, 440px); margin: 0 auto; perspective: 900px; }
  .card { aspect-ratio: 1; border: 0; padding: 0; background: none; position: relative; transform-style: preserve-3d; transition: transform .35s cubic-bezier(.2,.7,.2,1); }
  .card.up, .card.done { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; border-radius: 12px; backface-visibility: hidden; display: grid; place-items: center; }
  .back { background: linear-gradient(135deg, #1b2150, #2a1f5c); border: 1px solid var(--edge); }
  .back::after { content: ""; width: 34%; aspect-ratio: 1; border-radius: 50%; border: 2px solid rgba(64,224,255,.45); }
  .front { transform: rotateY(180deg); background: #0f1330; border: 1px solid var(--edge); }
  .front svg { width: 56%; height: 56%; }
  .card.done .front { border-color: var(--lime); box-shadow: 0 0 18px rgba(157,255,106,.3); }
  .levels { display: flex; gap: 8px; justify-content: center; }
</style>
<body>
<div class="stage">
  <div class="panel">
    <h1 class="title">Memory Match</h1>
    <div class="hud">
      <div class="stat"><small>Moves</small><b id="moves">0</b></div>
      <div class="stat"><small>Time</small><b id="time">0:00</b></div>
      <div class="stat"><small>Best (moves)</small><b id="best">–</b></div>
    </div>
    <div class="cards" id="cards" aria-label="Memory cards"></div>
    <p class="msg" id="msg" aria-live="polite">Flip two cards at a time and find all 8 pairs.</p>
    <div class="hud"><button class="btn primary" id="new">Shuffle and restart</button></div>
  </div>
</div>
<script>
(function () {
  var GH = GameHub; GH.config({ lowerIsBetter: true });
  var ICONS = [
    ["#40e0ff", '<circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="12" cy="12" r="3" fill="currentColor"/>'],
    ["#ff4fa3", '<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z" fill="currentColor"/>'],
    ["#9dff6a", '<path d="M12 3l9 16H3z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>'],
    ["#ffc857", '<path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="currentColor"/>'],
    ["#8b6bff", '<rect x="5" y="5" width="14" height="14" rx="2" transform="rotate(45 12 12)" fill="currentColor"/>'],
    ["#ff7a6b", '<path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="currentColor"/>'],
    ["#6bf2c4", '<path d="M4 12h16M12 4v16" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>'],
    ["#e8ebff", '<path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/>']
  ];
  var el = document.getElementById("cards"), deck, open, matched, moves, seconds, timer, lock, started;

  function fmt(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function newGame() {
    clearInterval(timer);
    deck = shuffle([0,1,2,3,4,5,6,7,0,1,2,3,4,5,6,7]);
    open = []; matched = 0; moves = 0; seconds = 0; lock = false; started = false;
    el.innerHTML = "";
    deck.forEach(function (icon, i) {
      var b = document.createElement("button");
      b.className = "card"; b.setAttribute("aria-label", "Hidden card " + (i + 1));
      b.innerHTML = '<span class="face back"></span><span class="face front" style="color:' + ICONS[icon][0] + '"><svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[icon][1] + "</svg></span>";
      b.addEventListener("click", function () { flip(b, i); });
      el.appendChild(b);
    });
    var best = GH.best(); document.getElementById("best").textContent = best === null ? "–" : best;
    document.getElementById("msg").textContent = "Flip two cards at a time and find all 8 pairs.";
    update(); GH.score(0);
  }
  function update() {
    document.getElementById("moves").textContent = moves;
    document.getElementById("time").textContent = fmt(seconds);
  }
  function flip(b, i) {
    if (lock || GH.paused || b.classList.contains("up") || b.classList.contains("done")) return;
    if (!started) { started = true; timer = setInterval(function () { if (!GH.paused) { seconds++; update(); } }, 1000); }
    b.classList.add("up"); b.setAttribute("aria-label", "Card " + (i + 1) + " revealed");
    GH.sound(500, 0.04, "sine", 0.03);
    open.push({ b: b, i: i });
    if (open.length < 2) return;
    moves++; update(); GH.score(moves);
    var a = open[0], c = open[1];
    if (deck[a.i] === deck[c.i]) {
      a.b.classList.add("done"); c.b.classList.add("done"); open = []; matched++;
      GH.sound(760, 0.12, "triangle", 0.05, 1140);
      if (matched === 8) {
        clearInterval(timer);
        var r = GH.win(moves);
        document.getElementById("best").textContent = r.best;
        document.getElementById("msg").textContent = "All pairs found in " + moves + " moves and " + fmt(seconds) + (r.isNew ? ". New best!" : ".");
      }
    } else {
      lock = true;
      setTimeout(function () { a.b.classList.remove("up"); c.b.classList.remove("up"); open = []; lock = false; }, 750);
    }
  }
  document.getElementById("new").addEventListener("click", newGame);
  GH.on("restart", newGame);
  newGame();
})();
</script>
</body>
</html>
