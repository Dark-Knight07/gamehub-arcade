<!doctype html>
<html lang="en" data-game="mine-grid">
<head>
<!-- Offline edition from Owais GameHub. Open this file in any modern browser. -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Mine Grid | Owais GameHub</title>
<style>
/* Shared look for every Owais GameHub game */
:root {
  --bg: #06070d; --panel: #11142a; --edge: rgba(148, 163, 255, 0.18);
  --ink: #e8ebff; --dim: #8f96bf; --cyan: #40e0ff; --violet: #8b6bff; --rose: #ff4fa3; --lime: #9dff6a; --amber: #ffc857;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at 50% 0%, #151a3a 0%, var(--bg) 70%); color: var(--ink);
  font-family: "Sora Variable", "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
.stage { position: fixed; inset: 0; display: grid; place-items: center; }
canvas { display: block; border-radius: 10px; box-shadow: 0 0 0 1px var(--edge), 0 30px 80px -30px rgba(64, 224, 255, 0.35); }
button { font: inherit; color: inherit; cursor: pointer; }
.btn { border: 1px solid var(--edge); background: rgba(255, 255, 255, 0.05); padding: 10px 18px; border-radius: 10px; font-weight: 600; }
.btn:hover { border-color: var(--cyan); }
.btn.primary { background: linear-gradient(135deg, var(--cyan), var(--violet)); border: 0; color: #050612; }
.btn.on { border-color: var(--cyan); background: rgba(64, 224, 255, 0.12); }
.hud { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.stat { background: rgba(255, 255, 255, 0.04); border: 1px solid var(--edge); border-radius: 10px; padding: 8px 14px; text-align: center; min-width: 84px; }
.stat small { display: block; color: var(--dim); font-size: 11px; letter-spacing: .04em; }
.stat b { font-size: 20px; font-variant-numeric: tabular-nums; }
.msg { min-height: 24px; text-align: center; color: var(--dim); font-size: 14px; }
.panel { width: min(96vw, 560px); display: grid; gap: 16px; padding: 16px; }
.title { margin: 0; text-align: center; font-size: 22px; letter-spacing: .02em; }
.ogh-pause { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
  background: rgba(6, 7, 13, 0.82); backdrop-filter: blur(6px); z-index: 99; cursor: pointer; }
.ogh-pause strong { font-size: 32px; }
.ogh-pause p { color: var(--dim); margin: 8px 0 0; }
.ogh-pause .ogh-keys { font-size: 13px; }
@media (max-height: 520px) { .panel { gap: 10px; padding: 8px; } .stat b { font-size: 16px; } }

</style>
<script>
/*
 * Owais GameHub Game SDK
 * Shared by every built-in game. Talks to the GameHub player through postMessage:
 *   host -> game : { source: "ogh-host", type: "pause" | "resume" | "restart" | "mute", muted }
 *   game -> host : { source: "ogh-game", game, type: "ready" | "score" | "gameover" | "win" | "paused" | "resumed" | "muted", ... }
 * When a game runs on its own (offline download), the SDK shows its own pause screen and
 * handles P / Esc (pause), R (restart) and M (mute).
 */
(function () {
  "use strict";
  var GAME_ID = document.documentElement.getAttribute("data-game") || "game";
  var embedded = window.parent !== window;
  var handlers = {};
  var audioCtx = null;
  var lowerIsBetter = false;
  var overlay = null;

  function read(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (e) {
      return fallback;
    }
  }
  function write(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {
      /* storage unavailable: the game still works, it just won't remember */
    }
  }
  function emit(ev, arg) {
    (handlers[ev] || []).forEach(function (fn) {
      try { fn(arg); } catch (e) { console.error(e); }
    });
  }

  var GH = {
    id: GAME_ID,
    embedded: embedded,
    paused: false,
    muted: read("ogh:muted", false) === true,

    config: function (opts) {
      lowerIsBetter = !!(opts && opts.lowerIsBetter);
    },
    on: function (ev, fn) {
      (handlers[ev] = handlers[ev] || []).push(fn);
    },
    send: function (type, data) {
      if (!embedded) return;
      var msg = { source: "ogh-game", game: GAME_ID, type: type };
      if (data) for (var k in data) msg[k] = data[k];
      try { window.parent.postMessage(msg, window.location.origin === "null" ? "*" : window.location.origin); } catch (e) { /* ignore */ }
    },
    ready: function () {
      GH.send("ready", { muted: GH.muted });
    },
    score: function (value) {
      GH.send("score", { value: value });
    },
    best: function () {
      return read("ogh:best:" + GAME_ID, null);
    },
    submit: function (value) {
      var best = GH.best();
      var better = best === null || (lowerIsBetter ? value < best : value > best);
      if (better) write("ogh:best:" + GAME_ID, value);
      return { best: better ? value : best, isNew: better };
    },
    gameOver: function (finalScore) {
      var r = GH.submit(finalScore);
      GH.send("gameover", { score: finalScore, best: r.best, isNew: r.isNew });
      return r;
    },
    win: function (finalScore) {
      var r = GH.submit(finalScore);
      GH.send("win", { score: finalScore, best: r.best, isNew: r.isNew });
      return r;
    },
    save: function (state) { write("ogh:save:" + GAME_ID, state); },
    load: function () { return read("ogh:save:" + GAME_ID, null); },
    clearSave: function () {
      try { localStorage.removeItem("ogh:save:" + GAME_ID); } catch (e) { /* ignore */ }
    },

    pause: function () {
      if (GH.paused) return;
      GH.paused = true;
      emit("pause");
      GH.send("paused");
      showOverlay(true);
    },
    resume: function () {
      if (!GH.paused) return;
      GH.paused = false;
      emit("resume");
      GH.send("resumed");
      showOverlay(false);
    },
    togglePause: function () {
      GH.paused ? GH.resume() : GH.pause();
    },
    restart: function () {
      GH.paused = false;
      showOverlay(false);
      emit("restart");
      GH.send("resumed");
    },
    setMuted: function (m) {
      GH.muted = !!m;
      write("ogh:muted", GH.muted);
      emit("mute", GH.muted);
      GH.send("muted", { muted: GH.muted });
    },

    /* Short synthesized sound effect: GH.sound(440, 0.08, "square", 0.05, 220) */
    sound: function (freq, duration, type, volume, slideTo) {
      if (GH.muted) return;
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        var t = audioCtx.currentTime;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = type || "sine";
        osc.frequency.setValueAtTime(freq, t);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + (duration || 0.1));
        gain.gain.setValueAtTime(volume || 0.05, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + (duration || 0.1));
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + (duration || 0.1) + 0.02);
      } catch (e) { /* audio blocked */ }
    },

    /* Canvas at a fixed logical size, scaled to fit the viewport and sharp on HiDPI screens */
    fit: function (canvas, W, H) {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      canvas._W = W;
      canvas._H = H;
      var c = canvas.getContext("2d");
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      function size() {
        var s = Math.min(window.innerWidth / W, window.innerHeight / H);
        canvas.style.width = Math.floor(W * s) + "px";
        canvas.style.height = Math.floor(H * s) + "px";
      }
      size();
      window.addEventListener("resize", size);
      return c;
    },
    /* Pointer/touch position in logical canvas coordinates */
    point: function (canvas, e) {
      var r = canvas.getBoundingClientRect();
      var src = e.touches && e.touches[0] ? e.touches[0] : e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : e;
      return {
        x: ((src.clientX - r.left) / r.width) * canvas._W,
        y: ((src.clientY - r.top) / r.height) * canvas._H,
      };
    },
    /* Fixed-timestep-friendly loop; update is skipped while paused */
    loop: function (update, render) {
      var last = performance.now();
      function frame(now) {
        var dt = Math.min((now - last) / 1000, 1 / 20);
        last = now;
        if (!GH.paused) update(dt);
        render();
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    },
    /* Swipe detection: cb("up" | "down" | "left" | "right") */
    swipe: function (el, cb, min) {
      var sx = 0, sy = 0, active = false;
      min = min || 24;
      el.addEventListener("touchstart", function (e) {
        active = true;
        sx = e.touches[0].clientX;
        sy = e.touches[0].clientY;
      }, { passive: true });
      el.addEventListener("touchmove", function (e) {
        if (active) e.preventDefault();
      }, { passive: false });
      el.addEventListener("touchend", function (e) {
        if (!active) return;
        active = false;
        var dx = e.changedTouches[0].clientX - sx;
        var dy = e.changedTouches[0].clientY - sy;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < min) return;
        cb(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : dy > 0 ? "down" : "up");
      });
    },
  };

  function showOverlay(on) {
    if (embedded) return; // the GameHub player draws its own pause screen
    if (!overlay) {
      overlay = document.createElement("div");
      overlay.className = "ogh-pause";
      overlay.innerHTML =
        '<div><strong>Paused</strong><p>Press P or tap to resume</p><p class="ogh-keys">R restart &nbsp; M sound on/off</p></div>';
      overlay.addEventListener("click", GH.resume);
      document.body.appendChild(overlay);
    }
    overlay.style.display = on ? "flex" : "none";
  }

  window.addEventListener("message", function (e) {
    if (e.origin !== window.location.origin && window.location.origin !== "null") return;
    var d = e.data;
    if (!d || d.source !== "ogh-host") return;
    if (d.type === "pause") GH.pause();
    else if (d.type === "resume") GH.resume();
    else if (d.type === "restart") GH.restart();
    else if (d.type === "mute") GH.setMuted(d.muted);
  });

  window.addEventListener("keydown", function (e) {
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    var k = e.key.toLowerCase();
    if (k === "p" || k === "escape") GH.togglePause();
    else if (k === "r" && !e.ctrlKey && !e.metaKey) GH.restart();
    else if (k === "m") GH.setMuted(!GH.muted);
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) GH.pause();
  });

  /* Canvas text and overlay helpers used by the arcade games */
  GH.text = function (c, s, x, y, size, color, align, weight) {
    c.font = (weight || 600) + " " + size + "px 'Sora Variable', 'Segoe UI', system-ui, sans-serif";
    c.fillStyle = color || "#e8ebff";
    c.textAlign = align || "center";
    c.textBaseline = "middle";
    c.fillText(s, x, y);
  };
  GH.card = function (c, W, H, title, sub, extra) {
    c.fillStyle = "rgba(6, 7, 13, 0.74)";
    c.fillRect(0, 0, W, H);
    GH.text(c, title, W / 2, H / 2 - 26, Math.min(40, W / 10), "#e8ebff", "center", 700);
    if (sub) GH.text(c, sub, W / 2, H / 2 + 16, 15, "#8f96bf", "center", 500);
    if (extra) GH.text(c, extra, W / 2, H / 2 + 46, 14, "#40e0ff", "center", 600);
  };
  GH.rand = function (a, b) { return a + Math.random() * (b - a); };
  GH.hit = function (a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  };

  window.GameHub = GH;
  window.addEventListener("load", GH.ready);
})();

</script>
</head>
<style>
  .field { display: grid; gap: 3px; margin: 0 auto; width: min(94vw, 62vh, 520px); touch-action: manipulation; }
  .sq { aspect-ratio: 1; border: 0; border-radius: 4px; background: #232a5c; font-weight: 800; font-size: clamp(11px, 3.2vw, 18px); padding: 0; box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }
  .sq:hover:not(.open) { background: #2d3674; }
  .sq.open { background: rgba(255,255,255,0.05); box-shadow: none; cursor: default; }
  .sq.boom { background: var(--rose); }
  .sq.flag::after { content: "⚑"; color: var(--amber); }
  .n1 { color: #40e0ff; } .n2 { color: #9dff6a; } .n3 { color: #ff4fa3; } .n4 { color: #8b6bff; } .n5 { color: #ffc857; } .n6 { color: #6bf2c4; } .n7 { color: #fff; } .n8 { color: #8f96bf; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
</style>
<body>
<div class="stage">
  <div class="panel">
    <h1 class="title">Mine Grid</h1>
    <div class="row" role="group" aria-label="Difficulty">
      <button class="btn" data-lvl="easy">Easy</button>
      <button class="btn" data-lvl="medium">Medium</button>
      <button class="btn" data-lvl="hard">Hard</button>
    </div>
    <div class="hud">
      <div class="stat"><small>Mines left</small><b id="left">0</b></div>
      <div class="stat"><small>Time</small><b id="time">0</b></div>
      <div class="stat"><small>Best time</small><b id="best">–</b></div>
      <button class="btn" id="flagMode" aria-pressed="false">Flag mode: off</button>
    </div>
    <div class="field" id="field" aria-label="Mine field"></div>
    <p class="msg" id="msg" aria-live="polite">Clear every safe square. Right-click, long-press, or use flag mode to mark mines.</p>
    <div class="hud"><button class="btn primary" id="new">New game</button></div>
  </div>
</div>
<script>
(function () {
  var GH = GameHub;
  var LEVELS = { easy: { n: 9, m: 10 }, medium: { n: 12, m: 22 }, hard: { n: 16, m: 40 } };
  var lvl = "easy", N, M, mines, open, flags, cells, first, over, seconds, timer, flagMode = false, opened;
  var field = document.getElementById("field");

  function key() { return "ogh:best:mine-grid:" + lvl; }
  function getBest() { try { return JSON.parse(localStorage.getItem(key())); } catch (e) { return null; } }
  function around(i) {
    var r = Math.floor(i / N), c = i % N, out = [];
    for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      var rr = r + dr, cc = c + dc;
      if (rr >= 0 && rr < N && cc >= 0 && cc < N) out.push(rr * N + cc);
    }
    return out;
  }
  function count(i) { return around(i).filter(function (j) { return mines[j]; }).length; }
  function newGame() {
    clearInterval(timer);
    N = LEVELS[lvl].n; M = LEVELS[lvl].m;
    mines = Array(N * N).fill(false); open = Array(N * N).fill(false); flags = Array(N * N).fill(false);
    first = true; over = false; seconds = 0; opened = 0;
    field.style.gridTemplateColumns = "repeat(" + N + ", 1fr)";
    field.innerHTML = ""; cells = [];
    for (var i = 0; i < N * N; i++) {
      var b = document.createElement("button");
      b.className = "sq"; b.dataset.i = i; b.setAttribute("aria-label", "Hidden square");
      bind(b, i); field.appendChild(b); cells.push(b);
    }
    document.querySelectorAll("[data-lvl]").forEach(function (b) { b.classList.toggle("on", b.dataset.lvl === lvl); });
    var best = getBest(); document.getElementById("best").textContent = best === null ? "–" : best + "s";
    document.getElementById("msg").textContent = "Clear every safe square. Right-click, long-press, or use flag mode to mark mines.";
    stats(); GH.score(0);
  }
  function bind(b, i) {
    var pressT = null, longFired = false;
    b.addEventListener("contextmenu", function (e) { e.preventDefault(); toggleFlag(i); });
    b.addEventListener("touchstart", function () { longFired = false; pressT = setTimeout(function () { longFired = true; toggleFlag(i); if (navigator.vibrate) navigator.vibrate(20); }, 380); }, { passive: true });
    b.addEventListener("touchend", function (e) { clearTimeout(pressT); if (longFired) e.preventDefault(); });
    b.addEventListener("touchmove", function () { clearTimeout(pressT); }, { passive: true });
    b.addEventListener("click", function () { if (longFired) { longFired = false; return; } flagMode ? toggleFlag(i) : reveal(i); });
  }
  function plant(safe) {
    var banned = around(safe).concat([safe]), placed = 0;
    while (placed < M) {
      var j = Math.floor(Math.random() * N * N);
      if (!mines[j] && banned.indexOf(j) < 0) { mines[j] = true; placed++; }
    }
  }
  function stats() {
    document.getElementById("left").textContent = M - flags.filter(Boolean).length;
    document.getElementById("time").textContent = seconds;
  }
  function toggleFlag(i) {
    if (over || open[i] || GH.paused) return;
    flags[i] = !flags[i];
    cells[i].classList.toggle("flag", flags[i]);
    cells[i].setAttribute("aria-label", flags[i] ? "Flagged square" : "Hidden square");
    GH.sound(flags[i] ? 640 : 380, 0.04, "square", 0.03);
    stats();
  }
  function reveal(i) {
    if (over || flags[i] || GH.paused) return;
    if (first) {
      first = false; plant(i);
      timer = setInterval(function () { if (!GH.paused && !over) { seconds++; stats(); } }, 1000);
    }
    if (open[i]) return chord(i);
    if (mines[i]) return lose(i);
    flood(i); GH.sound(520, 0.03, "triangle", 0.03); check();
  }
  function flood(start) {
    var stack = [start];
    while (stack.length) {
      var i = stack.pop();
      if (open[i] || flags[i]) continue;
      open[i] = true; opened++;
      var n = count(i), el = cells[i];
      el.classList.add("open"); el.textContent = n || ""; if (n) el.classList.add("n" + n);
      el.setAttribute("aria-label", n ? n + " mines nearby" : "Empty");
      if (!n) around(i).forEach(function (j) { if (!open[j]) stack.push(j); });
    }
    GH.score(opened);
  }
  function chord(i) {
    var n = count(i), f = around(i).filter(function (j) { return flags[j]; }).length;
    if (!n || n !== f) return;
    var hit = -1;
    around(i).forEach(function (j) { if (!flags[j] && !open[j]) { if (mines[j]) hit = j; else flood(j); } });
    if (hit >= 0) lose(hit); else check();
  }
  function lose(i) {
    over = true; clearInterval(timer);
    mines.forEach(function (m, j) { if (m) { cells[j].classList.add("open"); cells[j].textContent = "✹"; cells[j].style.color = "#ff4fa3"; } });
    cells[i].classList.add("boom"); cells[i].style.color = "#fff";
    document.getElementById("msg").textContent = "Boom. Press New game to try again.";
    GH.sound(120, 0.5, "sawtooth", 0.06, 40);
    GH.send("gameover", { score: opened });
  }
  function check() {
    if (opened !== N * N - M) return;
    over = true; clearInterval(timer);
    var best = getBest(), isNew = best === null || seconds < best;
    if (isNew) try { localStorage.setItem(key(), JSON.stringify(seconds)); } catch (e) {}
    document.getElementById("best").textContent = (isNew ? seconds : best) + "s";
    document.getElementById("msg").textContent = "Field cleared in " + seconds + " seconds" + (isNew ? ". New best!" : ".");
    GH.send("win", { score: seconds });
    GH.sound(880, 0.4, "triangle", 0.05, 1320);
  }
  document.getElementById("flagMode").addEventListener("click", function () {
    flagMode = !flagMode; this.classList.toggle("on", flagMode);
    this.setAttribute("aria-pressed", flagMode); this.textContent = "Flag mode: " + (flagMode ? "on" : "off");
  });
  document.querySelectorAll("[data-lvl]").forEach(function (b) { b.addEventListener("click", function () { lvl = b.dataset.lvl; newGame(); }); });
  document.getElementById("new").addEventListener("click", newGame);
  window.addEventListener("keydown", function (e) { if (e.key === "f" || e.key === "F") document.getElementById("flagMode").click(); });
  GH.on("restart", newGame);
  newGame();
})();
</script>
</body>
</html>
