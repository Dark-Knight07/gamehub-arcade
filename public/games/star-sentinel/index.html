<!doctype html>
<html lang="en" data-game="star-sentinel">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Star Sentinel | Owais GameHub</title>
<link rel="stylesheet" href="../_sdk/base.css" />
<script src="../_sdk/sdk.js"></script>
</head>
<body>
<div class="stage"><canvas id="c" aria-label="Star Sentinel space shooter"></canvas></div>
<script>
(function () {
  var GH = GameHub, cv = document.getElementById("c"), W = 480, H = 720, c = GH.fit(cv, W, H);
  var ship, shots, foes, foeShots, booms, stars, score, lives, state, time, spawnT, fireT, keys = {}, target = null, best, wave;
  stars = [];
  for (var i = 0; i < 90; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, z: Math.random() * 3 + 0.5 });

  function reset() {
    ship = { x: W / 2, y: H - 90, r: 16, inv: 0 };
    shots = []; foes = []; foeShots = []; booms = [];
    score = 0; lives = 3; time = 0; spawnT = 1; fireT = 0; wave = 1; target = null;
    state = "ready"; best = GH.best() || 0; GH.score(0);
  }
  function start() {
    if (GH.paused) return;
    if (state === "over") reset();
    if (state === "ready") state = "play";
  }
  function spawnFoe() {
    var kind = Math.random();
    var lvl = Math.min(1 + time / 25, 4);
    if (kind < 0.55) foes.push({ type: "drone", x: GH.rand(30, W - 30), y: -30, r: 16, vy: GH.rand(90, 140) * (0.8 + lvl * 0.2), hp: 1, t: 0, pts: 50 });
    else if (kind < 0.85) foes.push({ type: "weaver", x: GH.rand(60, W - 60), y: -30, r: 17, vy: 100 + lvl * 15, hp: 2, t: 0, ox: 0, pts: 100 });
    else foes.push({ type: "gunner", x: GH.rand(50, W - 50), y: -30, r: 22, vy: 60, hp: 4, t: 0, fire: 1.2, pts: 200 });
  }
  function explode(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * 6.28, s = GH.rand(40, 240);
      booms.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: GH.rand(0.3, 0.7), color: color });
    }
  }
  function hurt() {
    if (ship.inv > 0) return;
    lives--; ship.inv = 2;
    explode(ship.x, ship.y, "#40e0ff", 30);
    GH.sound(160, 0.4, "sawtooth", 0.06, 50);
    if (lives <= 0) { state = "over"; best = GH.gameOver(score).best; }
  }
  function update(dt) {
    stars.forEach(function (s) { s.y += s.z * (state === "play" ? 60 : 20) * dt; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } });
    booms.forEach(function (p) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt; });
    booms = booms.filter(function (p) { return p.life > 0; });
    if (state !== "play") return;
    time += dt; wave = 1 + Math.floor(time / 25);
    var sp = 360;
    if (keys.left) ship.x -= sp * dt;
    if (keys.right) ship.x += sp * dt;
    if (keys.up) ship.y -= sp * dt;
    if (keys.down) ship.y += sp * dt;
    if (target) { ship.x += (target.x - ship.x) * Math.min(1, dt * 14); ship.y += (target.y - ship.y) * Math.min(1, dt * 14); }
    ship.x = Math.max(20, Math.min(W - 20, ship.x)); ship.y = Math.max(H * 0.35, Math.min(H - 30, ship.y));
    ship.inv = Math.max(0, ship.inv - dt);
    fireT -= dt;
    if (fireT <= 0) {
      fireT = 0.17;
      shots.push({ x: ship.x - 8, y: ship.y - 14 }, { x: ship.x + 8, y: ship.y - 14 });
      GH.sound(900, 0.03, "square", 0.015, 600);
    }
    shots.forEach(function (s) { s.y -= 720 * dt; });
    shots = shots.filter(function (s) { return s.y > -20; });
    spawnT -= dt;
    if (spawnT <= 0) { spawnFoe(); spawnT = Math.max(0.35, 1.1 - time / 60); }
    foes.forEach(function (f) {
      f.t += dt; f.y += f.vy * dt;
      if (f.type === "weaver") f.x += Math.cos(f.t * 3) * 120 * dt;
      if (f.type === "gunner") {
        if (f.y > 120) f.vy = 20;
        f.fire -= dt;
        if (f.fire <= 0) {
          f.fire = 1.4;
          var a = Math.atan2(ship.y - f.y, ship.x - f.x);
          foeShots.push({ x: f.x, y: f.y, vx: Math.cos(a) * 230, vy: Math.sin(a) * 230 });
        }
      }
    });
    foeShots.forEach(function (s) { s.x += s.vx * dt; s.y += s.vy * dt; });
    foeShots = foeShots.filter(function (s) { return s.y < H + 20 && s.y > -20 && s.x > -20 && s.x < W + 20; });
    for (var i = foes.length - 1; i >= 0; i--) {
      var f = foes[i];
      for (var j = shots.length - 1; j >= 0; j--) {
        var s = shots[j];
        if (Math.abs(s.x - f.x) < f.r && Math.abs(s.y - f.y) < f.r) {
          shots.splice(j, 1); f.hp--;
          if (f.hp <= 0) {
            explode(f.x, f.y, f.type === "gunner" ? "#ffc857" : f.type === "weaver" ? "#9dff6a" : "#ff4fa3", 18);
            score += f.pts; GH.score(score); foes.splice(i, 1);
            GH.sound(140, 0.18, "square", 0.04, 60);
            break;
          }
        }
      }
    }
    foes = foes.filter(function (f) {
      if (Math.hypot(f.x - ship.x, f.y - ship.y) < f.r + ship.r - 4) { hurt(); explode(f.x, f.y, "#ff4fa3", 14); return false; }
      return f.y < H + 40;
    });
    foeShots = foeShots.filter(function (s) {
      if (Math.hypot(s.x - ship.x, s.y - ship.y) < ship.r - 4) { hurt(); return false; }
      return true;
    });
  }
  function drawShip(x, y) {
    c.save(); c.translate(x, y);
    c.shadowBlur = 20; c.shadowColor = "#40e0ff";
    c.fillStyle = "#40e0ff";
    c.beginPath(); c.moveTo(0, -20); c.lineTo(16, 14); c.lineTo(5, 8); c.lineTo(0, 16); c.lineTo(-5, 8); c.lineTo(-16, 14); c.closePath(); c.fill();
    c.fillStyle = "#ffc857"; c.shadowColor = "#ffc857";
    c.beginPath(); c.moveTo(-4, 16); c.lineTo(0, 24 + Math.random() * 8); c.lineTo(4, 16); c.fill();
    c.restore();
  }
  function render() {
    c.fillStyle = "#05060f"; c.fillRect(0, 0, W, H);
    stars.forEach(function (s) { c.fillStyle = "rgba(200,210,255," + s.z / 4 + ")"; c.fillRect(s.x, s.y, s.z * 0.8, s.z * 2); });
    c.shadowBlur = 10; c.shadowColor = "#40e0ff"; c.fillStyle = "#b8f4ff";
    shots.forEach(function (s) { c.fillRect(s.x - 1.5, s.y - 8, 3, 14); });
    c.shadowColor = "#ff4fa3"; c.fillStyle = "#ff8cc4";
    foeShots.forEach(function (s) { c.beginPath(); c.arc(s.x, s.y, 5, 0, 6.3); c.fill(); });
    foes.forEach(function (f) {
      c.save(); c.translate(f.x, f.y);
      if (f.type === "drone") {
        c.shadowColor = "#ff4fa3"; c.fillStyle = "#ff4fa3";
        c.beginPath(); c.moveTo(0, 16); c.lineTo(15, -10); c.lineTo(0, -4); c.lineTo(-15, -10); c.closePath(); c.fill();
      } else if (f.type === "weaver") {
        c.shadowColor = "#9dff6a"; c.fillStyle = "#9dff6a"; c.rotate(f.t * 3);
        c.fillRect(-12, -12, 24, 24);
        c.fillStyle = "#05060f"; c.fillRect(-5, -5, 10, 10);
      } else {
        c.shadowColor = "#ffc857"; c.fillStyle = "#ffc857";
        c.beginPath();
        for (var k = 0; k < 6; k++) { var a = k / 6 * 6.28; c.lineTo(Math.cos(a) * 22, Math.sin(a) * 22); }
        c.closePath(); c.fill();
        c.fillStyle = "#05060f"; c.beginPath(); c.arc(0, 0, 8, 0, 6.3); c.fill();
      }
      c.restore();
    });
    c.shadowBlur = 0;
    booms.forEach(function (p) { c.globalAlpha = Math.min(1, p.life * 2); c.fillStyle = p.color; c.fillRect(p.x - 2, p.y - 2, 4, 4); });
    c.globalAlpha = 1;
    if (state !== "over" && (ship.inv <= 0 || Math.floor(ship.inv * 10) % 2 === 0)) drawShip(ship.x, ship.y);
    GH.text(c, "Score " + score, 16, 28, 18, "#e8ebff", "left", 700);
    GH.text(c, "Wave " + wave, W / 2, 28, 15, "#8f96bf");
    for (var l = 0; l < lives; l++) { c.fillStyle = "#40e0ff"; c.beginPath(); c.moveTo(W - 22 - l * 22, 20); c.lineTo(W - 14 - l * 22, 36); c.lineTo(W - 30 - l * 22, 36); c.fill(); }
    if (state === "ready") GH.card(c, W, H, "Star Sentinel", "Drag, or use arrow keys to fly. You fire automatically.", "Tap or press Space to launch");
    if (state === "over") GH.card(c, W, H, "Ship destroyed", "Score " + score + "   Best " + best, "Tap or press Space to fly again");
  }
  var km = { ArrowLeft: "left", a: "left", ArrowRight: "right", d: "right", ArrowUp: "up", w: "up", ArrowDown: "down", s: "down" };
  window.addEventListener("keydown", function (e) {
    if (km[e.key]) { e.preventDefault(); keys[km[e.key]] = true; target = null; start(); }
    if (e.key === " ") { e.preventDefault(); start(); }
  });
  window.addEventListener("keyup", function (e) { if (km[e.key]) keys[km[e.key]] = false; });
  function aim(e) { if (state !== "play" || GH.paused) return; var p = GH.point(cv, e); target = { x: p.x, y: p.y - (e.touches ? 60 : 0) }; }
  cv.addEventListener("mousedown", function (e) { start(); aim(e); });
  cv.addEventListener("mousemove", function (e) { if (e.buttons) aim(e); });
  cv.addEventListener("mouseup", function () { target = null; });
  cv.addEventListener("touchstart", function (e) { e.preventDefault(); start(); aim(e); }, { passive: false });
  cv.addEventListener("touchmove", function (e) { e.preventDefault(); aim(e); }, { passive: false });
  cv.addEventListener("touchend", function () { target = null; });
  GH.on("pause", function () { keys = {}; target = null; });
  GH.on("restart", reset);
  reset();
  GH.loop(update, render);
})();
</script>
</body>
</html>
