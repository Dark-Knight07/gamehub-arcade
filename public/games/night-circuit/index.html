<!doctype html>
<html lang="en" data-game="night-circuit">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Night Circuit | Owais GameHub</title>
<link rel="stylesheet" href="../_sdk/base.css" />
<script src="../_sdk/sdk.js"></script>
</head>
<body>
<div class="stage"><canvas id="c" aria-label="Night Circuit racing game"></canvas></div>
<script>
(function () {
  var GH = GameHub, cv = document.getElementById("c"), W = 420, H = 720, c = GH.fit(cv, W, H);
  var ROAD_L = 60, ROAD_W = 300, LANE = ROAD_W / 3, LANES = [ROAD_L + LANE / 2, ROAD_L + LANE * 1.5, ROAD_L + LANE * 2.5];
  var PALETTE = ["#ff4fa3", "#ffc857", "#9dff6a", "#8b6bff", "#ff7a6b"];
  var car, traffic, speed, dist, state, spawnT, scroll, best, shake, t = 0;

  function reset() {
    car = { lane: 1, x: LANES[1], y: H - 150, w: 44, h: 78, tilt: 0 };
    traffic = []; speed = 320; dist = 0; spawnT = 0.8; scroll = 0; shake = 0;
    state = "ready"; best = GH.best() || 0; GH.score(0);
  }
  function steer(d) {
    if (GH.paused) return;
    if (state === "over") { if (t > 0.5) reset(); return; }
    if (state === "ready") { state = "play"; return; }
    var n = Math.max(0, Math.min(2, car.lane + d));
    if (n !== car.lane) { car.lane = n; GH.sound(300, 0.05, "triangle", 0.03, 380); }
  }
  function spawn() {
    var free = [0, 1, 2].filter(function (l) {
      return !traffic.some(function (o) { return o.lane === l && o.y < 160; });
    });
    if (!free.length) return;
    var lane = free[Math.floor(Math.random() * free.length)];
    traffic.push({ lane: lane, x: LANES[lane], y: -100, w: 44, h: 78, v: GH.rand(0.35, 0.6), color: PALETTE[Math.floor(Math.random() * PALETTE.length)] });
    if (Math.random() < Math.min(0.45, dist / 6000) && free.length > 2) {
      var other = free.filter(function (l) { return l !== lane; })[Math.floor(Math.random() * 2)];
      traffic.push({ lane: other, x: LANES[other], y: -100 - GH.rand(0, 40), w: 44, h: 78, v: GH.rand(0.35, 0.6), color: PALETTE[Math.floor(Math.random() * PALETTE.length)] });
    }
    spawnT = Math.max(0.42, 1.1 - dist / 9000) * GH.rand(0.8, 1.3);
  }
  function update(dt) {
    t += dt;
    var sp = state === "play" ? speed : 140;
    scroll = (scroll + sp * dt) % 80;
    shake = Math.max(0, shake - dt);
    var tx = LANES[car.lane];
    car.tilt = (tx - car.x) / 120;
    car.x += (tx - car.x) * Math.min(1, dt * 12);
    if (state !== "play") return;
    speed = Math.min(900, 320 + dist / 12);
    dist += speed * dt / 8;
    GH.score(Math.floor(dist));
    spawnT -= dt; if (spawnT <= 0) spawn();
    traffic.forEach(function (o) { o.y += speed * (1 - o.v) * dt; });
    traffic = traffic.filter(function (o) { return o.y < H + 100; });
    var me = { x: car.x - car.w / 2 + 5, y: car.y - car.h / 2 + 6, w: car.w - 10, h: car.h - 12 };
    for (var i = 0; i < traffic.length; i++) {
      var o = traffic[i];
      if (GH.hit(me, { x: o.x - o.w / 2, y: o.y - o.h / 2, w: o.w, h: o.h })) {
        state = "over"; t = 0; shake = 0.4;
        best = GH.gameOver(Math.floor(dist)).best;
        GH.sound(120, 0.5, "sawtooth", 0.06, 40);
        return;
      }
    }
  }
  function drawCar(x, y, color, tilt, lights) {
    c.save(); c.translate(x, y); c.rotate(tilt * 0.3);
    c.shadowBlur = 18; c.shadowColor = color; c.fillStyle = color;
    c.beginPath(); c.roundRect(-22, -39, 44, 78, 12); c.fill();
    c.shadowBlur = 0; c.fillStyle = "rgba(6,7,13,0.75)";
    c.beginPath(); c.roundRect(-16, -22, 32, 20, 5); c.fill();
    c.beginPath(); c.roundRect(-15, 12, 30, 14, 4); c.fill();
    c.fillStyle = lights ? "#fffbe0" : "#ff3355";
    c.fillRect(-18, lights ? -40 : 35, 9, 4); c.fillRect(9, lights ? -40 : 35, 9, 4);
    c.restore();
  }
  function render() {
    c.save();
    if (shake > 0) c.translate(GH.rand(-6, 6) * shake * 2, GH.rand(-6, 6) * shake * 2);
    c.fillStyle = "#070814"; c.fillRect(-10, -10, W + 20, H + 20);
    for (var y = -80 + scroll; y < H; y += 80) {
      c.fillStyle = "#0e1122"; c.fillRect(0, y, ROAD_L - 8, 40); c.fillRect(ROAD_L + ROAD_W + 8, y + 40, ROAD_L, 40);
      c.shadowBlur = 12; c.shadowColor = "#8b6bff"; c.fillStyle = "#8b6bff";
      c.fillRect(ROAD_L - 22, y + 10, 6, 22); c.fillRect(ROAD_L + ROAD_W + 16, y + 10, 6, 22);
      c.shadowBlur = 0;
    }
    c.fillStyle = "#12152b"; c.fillRect(ROAD_L, 0, ROAD_W, H);
    c.fillStyle = "#40e0ff"; c.shadowBlur = 12; c.shadowColor = "#40e0ff";
    c.fillRect(ROAD_L - 3, 0, 3, H); c.fillRect(ROAD_L + ROAD_W, 0, 3, H);
    c.shadowBlur = 0; c.fillStyle = "rgba(232,235,255,0.35)";
    for (var l = 1; l < 3; l++) for (var yy = -80 + scroll; yy < H; yy += 80) c.fillRect(ROAD_L + LANE * l - 2, yy, 4, 44);
    traffic.forEach(function (o) { drawCar(o.x, o.y, o.color, 0, false); });
    drawCar(car.x, car.y, "#40e0ff", car.tilt, true);
    c.fillStyle = "rgba(255,251,224,0.06)";
    c.beginPath(); c.moveTo(car.x - 18, car.y - 40); c.lineTo(car.x - 40, car.y - 200); c.lineTo(car.x + 40, car.y - 200); c.lineTo(car.x + 18, car.y - 40); c.fill();
    c.restore();
    GH.text(c, Math.floor(dist) + " m", 16, 28, 18, "#e8ebff", "left", 700);
    GH.text(c, Math.round(speed / 4) + " km/h", W - 16, 28, 15, "#40e0ff", "right");
    if (state === "ready") GH.card(c, W, H, "Night Circuit", "Arrow keys, A/D, or tap left and right to switch lanes", "Press Space or tap to start");
    if (state === "over") GH.card(c, W, H, "Crashed", "Distance " + Math.floor(dist) + " m   Best " + best + " m", "Tap or press Space to race again");
  }
  window.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft" || e.key === "a") { e.preventDefault(); steer(-1); }
    else if (e.key === "ArrowRight" || e.key === "d") { e.preventDefault(); steer(1); }
    else if (e.key === " ") { e.preventDefault(); if (state !== "play") steer(0); }
  });
  function tap(e) {
    var p = GH.point(cv, e);
    if (state !== "play") return steer(0);
    steer(p.x < W / 2 ? -1 : 1);
  }
  cv.addEventListener("mousedown", tap);
  cv.addEventListener("touchstart", function (e) { e.preventDefault(); tap(e); }, { passive: false });
  GH.on("restart", reset);
  reset();
  GH.loop(update, render);
})();
</script>
</body>
</html>
