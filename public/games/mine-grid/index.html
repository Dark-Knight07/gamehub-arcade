<!doctype html>
<html lang="en" data-game="mine-grid">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Mine Grid | Owais GameHub</title>
<link rel="stylesheet" href="../_sdk/base.css" />
<script src="../_sdk/sdk.js"></script>
</head>
<style>
  .field { display: grid; gap: 3px; margin: 0 auto; width: min(94vw, 62vh, 520px); touch-action: manipulation; }
  .sq { aspect-ratio: 1; border: 0; border-radius: 4px; background: #232a5c; font-weight: 800; font-size: clamp(11px, 3.2vw, 18px); padding: 0; box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }
  .sq:hover:not(.open) { background: #2d3674; }
  .sq.open { background: rgba(255,255,255,0.05); box-shadow: none; cursor: default; }
  .sq.boom { background: var(--rose); }
  .sq.flag::after { content: "⚑"; color: var(--amber); }
  .n1 { color: #40e0ff; } .n2 { color: #9dff6a; } .n3 { color: #ff4fa3; } .n4 { color: #8b6bff; } .n5 { color: #ffc857; } .n6 { color: #6bf2c4; } .n7 { color: #fff; } .n8 { color: #8f96bf; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
</style>
<body>
<div class="stage">
  <div class="panel">
    <h1 class="title">Mine Grid</h1>
    <div class="row" role="group" aria-label="Difficulty">
      <button class="btn" data-lvl="easy">Easy</button>
      <button class="btn" data-lvl="medium">Medium</button>
      <button class="btn" data-lvl="hard">Hard</button>
    </div>
    <div class="hud">
      <div class="stat"><small>Mines left</small><b id="left">0</b></div>
      <div class="stat"><small>Time</small><b id="time">0</b></div>
      <div class="stat"><small>Best time</small><b id="best">–</b></div>
      <button class="btn" id="flagMode" aria-pressed="false">Flag mode: off</button>
    </div>
    <div class="field" id="field" aria-label="Mine field"></div>
    <p class="msg" id="msg" aria-live="polite">Clear every safe square. Right-click, long-press, or use flag mode to mark mines.</p>
    <div class="hud"><button class="btn primary" id="new">New game</button></div>
  </div>
</div>
<script>
(function () {
  var GH = GameHub;
  var LEVELS = { easy: { n: 9, m: 10 }, medium: { n: 12, m: 22 }, hard: { n: 16, m: 40 } };
  var lvl = "easy", N, M, mines, open, flags, cells, first, over, seconds, timer, flagMode = false, opened;
  var field = document.getElementById("field");

  function key() { return "ogh:best:mine-grid:" + lvl; }
  function getBest() { try { return JSON.parse(localStorage.getItem(key())); } catch (e) { return null; } }
  function around(i) {
    var r = Math.floor(i / N), c = i % N, out = [];
    for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      var rr = r + dr, cc = c + dc;
      if (rr >= 0 && rr < N && cc >= 0 && cc < N) out.push(rr * N + cc);
    }
    return out;
  }
  function count(i) { return around(i).filter(function (j) { return mines[j]; }).length; }
  function newGame() {
    clearInterval(timer);
    N = LEVELS[lvl].n; M = LEVELS[lvl].m;
    mines = Array(N * N).fill(false); open = Array(N * N).fill(false); flags = Array(N * N).fill(false);
    first = true; over = false; seconds = 0; opened = 0;
    field.style.gridTemplateColumns = "repeat(" + N + ", 1fr)";
    field.innerHTML = ""; cells = [];
    for (var i = 0; i < N * N; i++) {
      var b = document.createElement("button");
      b.className = "sq"; b.dataset.i = i; b.setAttribute("aria-label", "Hidden square");
      bind(b, i); field.appendChild(b); cells.push(b);
    }
    document.querySelectorAll("[data-lvl]").forEach(function (b) { b.classList.toggle("on", b.dataset.lvl === lvl); });
    var best = getBest(); document.getElementById("best").textContent = best === null ? "–" : best + "s";
    document.getElementById("msg").textContent = "Clear every safe square. Right-click, long-press, or use flag mode to mark mines.";
    stats(); GH.score(0);
  }
  function bind(b, i) {
    var pressT = null, longFired = false;
    b.addEventListener("contextmenu", function (e) { e.preventDefault(); toggleFlag(i); });
    b.addEventListener("touchstart", function () { longFired = false; pressT = setTimeout(function () { longFired = true; toggleFlag(i); if (navigator.vibrate) navigator.vibrate(20); }, 380); }, { passive: true });
    b.addEventListener("touchend", function (e) { clearTimeout(pressT); if (longFired) e.preventDefault(); });
    b.addEventListener("touchmove", function () { clearTimeout(pressT); }, { passive: true });
    b.addEventListener("click", function () { if (longFired) { longFired = false; return; } flagMode ? toggleFlag(i) : reveal(i); });
  }
  function plant(safe) {
    var banned = around(safe).concat([safe]), placed = 0;
    while (placed < M) {
      var j = Math.floor(Math.random() * N * N);
      if (!mines[j] && banned.indexOf(j) < 0) { mines[j] = true; placed++; }
    }
  }
  function stats() {
    document.getElementById("left").textContent = M - flags.filter(Boolean).length;
    document.getElementById("time").textContent = seconds;
  }
  function toggleFlag(i) {
    if (over || open[i] || GH.paused) return;
    flags[i] = !flags[i];
    cells[i].classList.toggle("flag", flags[i]);
    cells[i].setAttribute("aria-label", flags[i] ? "Flagged square" : "Hidden square");
    GH.sound(flags[i] ? 640 : 380, 0.04, "square", 0.03);
    stats();
  }
  function reveal(i) {
    if (over || flags[i] || GH.paused) return;
    if (first) {
      first = false; plant(i);
      timer = setInterval(function () { if (!GH.paused && !over) { seconds++; stats(); } }, 1000);
    }
    if (open[i]) return chord(i);
    if (mines[i]) return lose(i);
    flood(i); GH.sound(520, 0.03, "triangle", 0.03); check();
  }
  function flood(start) {
    var stack = [start];
    while (stack.length) {
      var i = stack.pop();
      if (open[i] || flags[i]) continue;
      open[i] = true; opened++;
      var n = count(i), el = cells[i];
      el.classList.add("open"); el.textContent = n || ""; if (n) el.classList.add("n" + n);
      el.setAttribute("aria-label", n ? n + " mines nearby" : "Empty");
      if (!n) around(i).forEach(function (j) { if (!open[j]) stack.push(j); });
    }
    GH.score(opened);
  }
  function chord(i) {
    var n = count(i), f = around(i).filter(function (j) { return flags[j]; }).length;
    if (!n || n !== f) return;
    var hit = -1;
    around(i).forEach(function (j) { if (!flags[j] && !open[j]) { if (mines[j]) hit = j; else flood(j); } });
    if (hit >= 0) lose(hit); else check();
  }
  function lose(i) {
    over = true; clearInterval(timer);
    mines.forEach(function (m, j) { if (m) { cells[j].classList.add("open"); cells[j].textContent = "✹"; cells[j].style.color = "#ff4fa3"; } });
    cells[i].classList.add("boom"); cells[i].style.color = "#fff";
    document.getElementById("msg").textContent = "Boom. Press New game to try again.";
    GH.sound(120, 0.5, "sawtooth", 0.06, 40);
    GH.send("gameover", { score: opened });
  }
  function check() {
    if (opened !== N * N - M) return;
    over = true; clearInterval(timer);
    var best = getBest(), isNew = best === null || seconds < best;
    if (isNew) try { localStorage.setItem(key(), JSON.stringify(seconds)); } catch (e) {}
    document.getElementById("best").textContent = (isNew ? seconds : best) + "s";
    document.getElementById("msg").textContent = "Field cleared in " + seconds + " seconds" + (isNew ? ". New best!" : ".");
    GH.send("win", { score: seconds });
    GH.sound(880, 0.4, "triangle", 0.05, 1320);
  }
  document.getElementById("flagMode").addEventListener("click", function () {
    flagMode = !flagMode; this.classList.toggle("on", flagMode);
    this.setAttribute("aria-pressed", flagMode); this.textContent = "Flag mode: " + (flagMode ? "on" : "off");
  });
  document.querySelectorAll("[data-lvl]").forEach(function (b) { b.addEventListener("click", function () { lvl = b.dataset.lvl; newGame(); }); });
  document.getElementById("new").addEventListener("click", newGame);
  window.addEventListener("keydown", function (e) { if (e.key === "f" || e.key === "F") document.getElementById("flagMode").click(); });
  GH.on("restart", newGame);
  newGame();
})();
</script>
</body>
</html>
